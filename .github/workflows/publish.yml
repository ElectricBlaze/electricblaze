name: Publish to npm
# Trusted publishing (OIDC): no npm token is stored anywhere.
# Configure once on npmjs.com → package → Settings → Trusted Publisher:
#   owner: ElectricBlaze, repository: electricblaze, workflow: publish.yml
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest && npm -v
      - name: Tag must match package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          test "$PKG" = "$TAG" || { echo "package.json is $PKG but tag is $TAG"; exit 1; }
      - run: npm test
      - run: npm publish --provenance --access public
