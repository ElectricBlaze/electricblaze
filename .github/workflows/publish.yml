name: Publish to npm
# Trusted publishing (OIDC): no npm token is stored anywhere.
# Configure once on npmjs.com → package → Settings → Trusted Publisher:
#   owner: ElectricBlaze, repository: electricblaze, workflow: publish.yml
on:
  push:
    tags: ["v*"]
permissions:
  contents: write   # the GitHub release
  id-token: write   # npm provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Bundled npm must support trusted publishing (11.5.1+)
        # Node 24 ships npm 11.19; nothing is installed here on purpose (no unpinned global install).
        run: |
          V=$(npm -v)
          test "$(printf '%s\n11.5.1\n' "$V" | sort -V | head -n1)" = "11.5.1" || { echo "npm $V is too old for trusted publishing"; exit 1; }
      - name: Tag must match package version and have a changelog section
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          test "$PKG" = "$TAG" || { echo "package.json is $PKG but tag is $TAG"; exit 1; }
          node .github/scripts/release-notes.mjs "$TAG" > /tmp/release-notes.md
          cat /tmp/release-notes.md
      - run: npm test
      - run: npm publish --provenance --access public
      - name: GitHub release with the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
